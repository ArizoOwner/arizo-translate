<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi Mascot – Interactive Preview | Arizo Translate</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0c0e17 80%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: default;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #e9d5ff, #c084fc, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-top: -12px;
      text-align: center;
    }

    /* Interactive Mascot Container */
    .mascot-stage {
      position: relative;
      width: 220px;
      height: 220px;
      cursor: pointer;
    }

    .mascot-aura {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(99, 102, 241, 0.15) 50%, transparent 70%);
      pointer-events: none;
      animation: auraPulse 3s ease-in-out infinite alternate;
    }

    @keyframes auraPulse {
      from { transform: scale(0.92); opacity: 0.6; }
      to { transform: scale(1.08); opacity: 0.95; }
    }

    .mascot-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #d8b4fe 0%, #a855f7 30%, #6366f1 70%, #312e81 100%);
      border: 3px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 35px rgba(168, 85, 247, 0.4);
      transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .mascot-gloss {
      position: absolute;
      top: 10px;
      left: 24px;
      width: 80px;
      height: 35px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      transform: rotate(-25deg);
      filter: blur(1px);
    }

    .mascot-blush {
      position: absolute;
      top: 125px;
      width: 30px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.7) 0%, transparent 70%);
    }
    .mascot-blush.left { left: 24px; }
    .mascot-blush.right { right: 24px; }

    .mascot-eyes {
      position: absolute;
      top: 75px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 36px;
    }

    .mascot-eye {
      position: relative;
      width: 44px;
      height: 56px;
      background: #ffffff;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #1e1b4b;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.2);
    }

    .mascot-pupil {
      position: absolute;
      top: 12px;
      left: 10px;
      width: 24px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #1e1b4b 0%, #0f172a 80%, #020617 100%);
      transition: transform 0.05s ease-out;
    }

    .glint-main {
      position: absolute;
      top: 5px;
      left: 4px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffffff;
    }

    .glint-sub {
      position: absolute;
      bottom: 6px;
      right: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.85;
    }

    .mascot-eyelid {
      position: absolute;
      inset: 0;
      background: #9333ea;
      transform: translateY(-100%);
      transition: transform 0.12s ease-in-out;
    }

    .mascot-eyelid.blink {
      transform: translateY(0);
    }

    .mascot-mouth {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 14px;
      border-radius: 0 0 16px 16px;
      background: #e11d48;
      border: 2px solid #1e1b4b;
      transition: all 0.2s ease;
    }

    .mascot-mouth.happy {
      height: 22px;
      border-radius: 4px 4px 18px 18px;
    }

    .instruction {
      font-size: 13px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.06);
      padding: 8px 18px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Meet Mochi – Arizo AI Mascot</h1>
    <p class="subtitle">Move your mouse anywhere on this page to watch Mochi track your cursor in real time!</p>

    <div class="mascot-stage" id="stage">
      <div class="mascot-aura"></div>
      <div class="mascot-body" id="body">
        <div class="mascot-gloss"></div>
        <div class="mascot-blush left"></div>
        <div class="mascot-blush right"></div>

        <div class="mascot-eyes">
          <div class="mascot-eye">
            <div class="mascot-pupil" id="pupilL">
              <span class="glint-main"></span>
              <span class="glint-sub"></span>
            </div>
            <div class="mascot-eyelid" id="eyelidL"></div>
          </div>
          <div class="mascot-eye">
            <div class="mascot-pupil" id="pupilR">
              <span class="glint-main"></span>
              <span class="glint-sub"></span>
            </div>
            <div class="mascot-eyelid" id="eyelidR"></div>
          </div>
        </div>

        <div class="mascot-mouth" id="mouth"></div>
      </div>
    </div>

    <div class="instruction">💡 Click Mochi to give a cheerful wink & jump!</div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const body = document.getElementById('body');
    const pupilL = document.getElementById('pupilL');
    const pupilR = document.getElementById('pupilR');
    const eyelidL = document.getElementById('eyelidL');
    const eyelidR = document.getElementById('eyelidR');
    const mouth = document.getElementById('mouth');

    window.addEventListener('mousemove', (e) => {
      const rect = stage.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.hypot(dx, dy) || 1;

      // Max eye travel distance
      const maxEyeTravel = 11;
      const eyeFactor = Math.min(dist / 220, 1) * maxEyeTravel;
      const eyeX = (dx / dist) * eyeFactor;
      const eyeY = (dy / dist) * eyeFactor;

      pupilL.style.transform = `translate(${eyeX}px, ${eyeY}px)`;
      pupilR.style.transform = `translate(${eyeX}px, ${eyeY}px)`;

      // Slight head tilt
      const headTiltX = (dx / dist) * 5;
      const headTiltY = (dy / dist) * 4;
      body.style.transform = `translate(${headTiltX}px, ${headTiltY}px)`;
    });

    // Random blinking
    function blink() {
      eyelidL.classList.add('blink');
      eyelidR.classList.add('blink');
      setTimeout(() => {
        eyelidL.classList.remove('blink');
        eyelidR.classList.remove('blink');
      }, 160);
      setTimeout(blink, 2500 + Math.random() * 4000);
    }
    setTimeout(blink, 1500);

    // Interactive click
    stage.addEventListener('click', () => {
      mouth.classList.add('happy');
      eyelidR.classList.add('blink');
      body.style.transform = 'scale(1.15) translateY(-14px)';
      setTimeout(() => {
        eyelidR.classList.remove('blink');
        mouth.classList.remove('happy');
        body.style.transform = 'none';
      }, 500);
    });
  </script>
</body>
</html>
