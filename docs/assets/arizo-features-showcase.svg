<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111625" />
      <stop offset="100%" stop-color="#0b0e18" />
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1100" height="420" fill="#080a11" rx="16" />

  <!-- SECTION TITLE -->
  <g transform="translate(550, 42)" text-anchor="middle">
    <text font-family="'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#ffffff">
      🚀 تجربه کاربری بی‌دردسر در ۳ حالت مختلف | 3 Powerful Interaction Modes
    </text>
  </g>

  <!-- CARD 1: IN-PLACE TRANSLATION -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="320" height="305" rx="16" fill="url(#cardBg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <!-- Badge -->
    <rect x="20" y="20" width="135" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" />
    <text x="87" y="37" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">Alt + Shift + D</text>

    <text x="20" y="74" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="16" fill="#ffffff">ترجمه درجا بدون تغییر پنجره</text>
    <text x="20" y="96" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12.5" fill="#94a3b8">Instant In-Place Replacement</text>

    <!-- Visual Mockup -->
    <g transform="translate(20, 115)">
      <!-- Chat box simulation -->
      <rect width="280" height="80" rx="10" fill="#171d2f" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#64748b">Telegram / Word / Discord</text>
      <text x="14" y="48" font-family="'Segoe UI', sans-serif" font-size="12" fill="#f8fafc">"سلام چطور پروژه رو بیلد کنم؟"</text>
      <!-- Arrow down -->
      <path d="M 140 92 L 140 106 M 134 100 L 140 106 L 146 100" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" />

      <!-- Replaced result -->
      <rect y="116" width="280" height="42" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="142" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#38bdf8">"Hi, how do I build the project?"</text>
    </g>
  </g>

  <!-- CARD 2: FLOATING RIGHT-CLICK BUBBLE -->
  <g transform="translate(390, 75)" filter="url(#shadow)">
    <rect width="320" height="305" rx="16" fill="url(#cardBg)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" />
    <!-- Badge -->
    <rect x="20" y="20" width="145" height="26" rx="13" fill="rgba(168, 85, 247, 0.15)" />
    <text x="92" y="37" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11.5" font-weight="700" fill="#c084fc" text-anchor="middle">راست کلیک روی متن</text>

    <text x="20" y="74" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="16" fill="#ffffff">حباب هوشمند شناور موس</text>
    <text x="20" y="96" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12.5" fill="#94a3b8">Context-Aware Floating Bubble</text>

    <!-- Visual Mockup -->
    <g transform="translate(20, 115)">
      <!-- Selected text line -->
      <rect width="280" height="40" rx="8" fill="#171d2f" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <!-- Selection highlight -->
      <rect x="10" y="8" width="135" height="24" rx="4" fill="rgba(168, 85, 247, 0.35)" />
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#ffffff">Selected text snippet</text>

      <!-- Mouse pointer -->
      <g transform="translate(145, 22)">
        <polygon points="0,0 0,16 5,12 9,19 12,17 8,11 14,10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
      </g>

      <!-- Floating Button Bubble -->
      <g transform="translate(175, 42)">
        <circle cx="22" cy="22" r="22" fill="#111422" stroke="#a855f7" stroke-width="1.8" />
        <circle cx="22" cy="22" r="16" fill="url(#purpleAccent)" />
        <text x="22" y="26" font-size="13" fill="#ffffff" text-anchor="middle">文</text>
        <!-- Popover hint -->
        <rect x="52" y="4" width="105" height="36" rx="8" fill="#161c2e" stroke="rgba(168,85,247,0.3)" stroke-width="1" />
        <text x="60" y="25" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" fill="#e9d5ff">ترجمه با یک کلیک</text>
      </g>
    </g>
  </g>

  <!-- CARD 3: DYNAMIC ISLAND -->
  <g transform="translate(740, 75)" filter="url(#shadow)">
    <rect width="320" height="305" rx="16" fill="url(#cardBg)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.2" />
    <!-- Badge -->
    <rect x="20" y="20" width="110" height="26" rx="13" fill="rgba(52, 211, 153, 0.12)" />
    <text x="75" y="37" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#34d399" text-anchor="middle">Alt + D</text>

    <text x="20" y="74" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="16" fill="#ffffff">داینامیک آیلند تعاملی</text>
    <text x="20" y="96" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12.5" fill="#94a3b8">Interactive Dynamic Island</text>

    <!-- Visual Mockup -->
    <g transform="translate(20, 115)">
      <!-- Mini Island Card -->
      <rect width="280" height="150" rx="12" fill="#14192b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

      <!-- Mini Mascot -->
      <circle cx="30" cy="28" r="14" fill="url(#purpleAccent)" />
      <circle cx="27" cy="27" r="2.2" fill="#0b0f19" />
      <circle cx="33" cy="27" r="2.2" fill="#0b0f19" />

      <!-- Mini controls -->
      <rect x="54" y="16" width="60" height="22" rx="11" fill="rgba(255,255,255,0.08)" />
      <rect x="180" y="16" width="45" height="22" rx="11" fill="rgba(52,211,153,0.15)" />
      <text x="202" y="31" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">FA ⇄ EN</text>

      <!-- Mini Text rows -->
      <rect x="14" y="52" width="252" height="38" rx="6" fill="#1b2238" />
      <text x="22" y="74" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">Heuristic AI Detection...</text>

      <rect x="14" y="96" width="252" height="42" rx="6" fill="#1f2742" stroke="rgba(52,211,153,0.2)" stroke-width="1" />
      <text x="256" y="122" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" fill="#34d399" text-anchor="end">تشخیص خودکار و بدون درنگ</text>
    </g>
  </g>
</svg>
